# SPDX-License-Identifier: GPL-2.0-or-later
# Build the Debian 13 host packages with scripts/build-packages.sh host, in a debian:trixie
# container: beanjar, beanjar-ui, beanjar-vnc, beanjar-web, beanjar-qemu, with the prebuilt
# programs of packaging/vendor.toml, natively for amd64 and arm64. Pushes to main and pull requests
# only check that they build; a manual run uploads the .deb files as workflow artifacts, with the
# released beanjar-guest of the host's contract beside them (packaging/guest_release.py; the Guest
# workflow builds and releases it). A tag v<version> releases the commit it points at, in the
# public repository only, here and in the Guest workflow, into one release: the tag must name the
# version the build produced (packaging/identity.py, from this repository's history), and
# scripts/release-debs.sh puts both architectures' .deb files into the release v<version> beside
# beanjar-guest, whichever workflow finishes first (packaging/debian/README.md, "Built on GitHub").
name: Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event_name }}-${{ github.ref }}
  # a release is never cancelled half-way
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  host:
    # Automatic runs only in the public repository; the private one runs these by hand
    if: github.repository == 'webosbrew/beanjar' || github.event_name == 'workflow_dispatch'
    name: host (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # upload: what a manual run and a release keep, architecture all once, from amd64
          - arch: amd64
            runner: ubuntu-24.04
            upload: |
              build/ci-packages/debs/*_amd64.deb
              build/ci-packages/debs/*_all.deb
          - arch: arm64
            runner: ubuntu-24.04-arm
            upload: build/ci-packages/debs/*_arm64.deb
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 90
    steps:
      # git first, so actions/checkout clones (the version comes from the history)
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        run: scripts/build-packages.sh host "$GITHUB_WORKSPACE/build/ci-packages"
      - name: Check the tag
        if: github.ref_type == 'tag'
        working-directory: build/ci-packages/debs
        run: |
          for deb in *.deb; do
            version=$(dpkg-deb -f "$deb" Version)
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "tag $GITHUB_REF_NAME does not name the version built, $version ($deb): tag this commit v$version" >&2
              exit 1
            fi
          done
      - name: Upload
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beanjar-debs-${{ matrix.arch }}
          path: ${{ matrix.upload }}
          if-no-files-found: error

  # beanjar-guest is not built here: a manual run fetches the newest release of the host's contract
  # on the public repository, checked against its SHA256SUMS
  guest:
    # By hand only, in either repository
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # PUBLISH_TOKEN (the private repository's, scoped to the public one) reads its releases while
      # that repository is private; elsewhere the job's own token does
      GH_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch
        run: python3 -I packaging/guest_release.py fetch --out build/ci-packages/debs
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beanjar-debs-guest
          path: |
            build/ci-packages/debs/beanjar-guest_*_all.deb
            build/ci-packages/debs/beanjar-guest-x86-64_*_amd64.deb
          if-no-files-found: error

  # Both architectures' packages into the release v<version>, which the Guest workflow fills with
  # beanjar-guest at the same time
  release:
    needs: host
    if: github.repository == 'webosbrew/beanjar' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/release-debs.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beanjar-debs-amd64
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beanjar-debs-arm64
          path: release
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release-debs.sh "$GITHUB_REF_NAME" release/*.deb
