# Boot a real VM without LG firmware: the open test guest (beanjar-vendor's Buildroot userland under
# our checks, guest/testguest) on the guest kernel, through the normal launcher, under TCG on
# GitHub's x86_64 runner, and its checks (GPU through virtio-gpu and virgl, the virtio-serial ports,
# the 9p shares, input, the 32-bit ABI bridge, a 64-bit ARM program, the guest's own power-off)
# with pass or fail and numbers (docs/dev/architecture/test-guest.md). scripts/testguest-ci.sh does
# the work, in a debian:trixie container as the other workflows. What is kept between runs: the
# vendored downloads (the userland, QEMU) and Meson's package cache (the kernel's and busybox's
# tarballs). The results and the VM's logs are the run's artifact.
name: Test guest

on:
  push:
    branches: [main]
    paths: &paths
      - "guest/**"
      - "host/core/**"
      - "host/helpers/media-helper/**"
      - "include/**"
      - "meson.build"
      - "meson.options"
      - "meson/**"
      - "subprojects/*.wrap"
      - "packaging/vendor.toml"
      - "packaging/debian/build-deps/**"
      - "scripts/testguest-*"
      - ".github/workflows/testguest.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testguest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Automatic runs only in the public repository; the private one runs these by hand
    if: github.repository == 'webosbrew/beanjar' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 45
    steps:
      # git first, so actions/checkout clones (the version and build-deps.sh's come from the history)
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # beanjar-vendor's tarballs, by the file that pins them
      - name: Vendored downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/vendor/download
          key: testguest-vendor-${{ hashFiles('packaging/vendor.toml') }}
          restore-keys: testguest-vendor-
      - name: Meson package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: subprojects/packagecache
          key: testguest-wraps-${{ hashFiles('subprojects/*.wrap') }}
          restore-keys: testguest-wraps-
      - name: Build and check
        run: scripts/testguest-ci.sh
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testguest
          path: |
            build/testguest/results.txt
            build/testguest/logs
          if-no-files-found: warn
