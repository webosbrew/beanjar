# The boot manifest of this launch (host/core/beanjar/targets.py), sourced by guest/initramfs/rootfs/init.
# the firmware target (chip-release)
TARGET="k8lpn-queue"
# the firmware's init: upstart, systemd or sysvinit (SimpleSmart)
INIT_SYSTEM="systemd"
# the firmware's kernel's highest capability: /proc/sys/kernel/cap_last_cap in webOS
CAP_LAST_CAP="40"
# the stock rootfs pak's disk serial: the overlay's bottom
ROOTFS="rootfs"
# the other paks, serial:mount point in the webOS root
PAKS="otncabi:/mnt/otncabi otycabi:/mnt/otycabi fonts:/mnt/fonts license:/mnt/license"
# lower layers made from a pak, serial:subdirectory, bottom to top, above the rootfs
PAK_LOWERS="bsppart:bsp"
# the layers, each the disk with serial layer-<name> (vm: the share "vm"), bottom to top, above those
LAYERS="common soc webos gl normal vm"
# read-write partitions, by serial
STATE_DISKS="db8 cmn_data appstore uhdcp partinfo authcxt sestore wossestore sedata dbboot efs"
# tvservice's raw NVM disks, by serial
NVM_DISKS="nvram eeprom"
# the NVM disk behind lgemu.ko's I2C EEPROM
NVM_EEPROM="eeprom"
# the disk with the eMMC partition map, lgemu.ko's /proc/partinfo
PARTINFO_DISK="partinfo"
# the eMMC partitions' nodes, N:serial: /dev/mmcblk0pN is that disk
PART_NODES=""
# how PmLogDaemon's whitelist goes for webos.pmlog=full (none: no PmLog)
PMLOG_MODE="preload-systemd"
# PmLogDaemon's Upstart job, or its systemd unit without .service
PMLOG_JOB="pm-log-daemon"
# the CA bundles the proxy's CA is appended to
TRUST_BUNDLES="etc/ssl/certs/ca-certificates.crt usr/share/ca-certificates/sdp/sdp-ca.pem"
# the hashed certificate directory
TRUST_HASH_DIR="etc/ssl/certs"
# the bootloader's parameters
BOARD_CMDLINE="/etc/emulator/board-atsc.cmdline"
# 1: they are on the kernel's command line already (the launcher's), not appended by init
BOARD_IN_KERNEL="0"
# send the native M-RCU cursor-on pulse before pointer motion
POINTER_WAKEUP="1"
# kernel modules to load after lgemu.ko
SOC_MODULES="rtk webos_tv dtv_soc"
# the kernel's own modules to load with modprobe: the stock kernel's USB drivers and filesystems
PERIPHERAL_MODULES="sit usbhid uhid joydev input-leds hid-axff hid-dr hid-logitech hid-microsoft hid-pl hid-sony hid-playstation hid-zpff xpad uvcvideo usb-storage sd_mod vfat ntfs3 fuse nls_cp437 nls_ascii nls_utf8 nls_iso8859-1 nls_cp949 exfat snd-usb-audio cdc-acm pl2303 option sierra lgfs ftdi_sio ch341 cp210x"
# rtk.ko's parameters
MODULE_PARAMS_rtk="rbus_phys=0x18000000 rbus_size=0x80000 pli_base=0x20000000 pli_max=0x60000000 pli_step=0x8000000 pli_rbus=0x10000000 pli_window=0x8000000 pli_uncached=0x8000000 pli_pad=0x10000 dcu1_base=0x20000000 dcu1_size=0x20000000 dcu2_base=0x40000000 dcu2_size=0x20000000 clock90k=0xb801b6b8,0xb801b6bc nodes=rtkaudio,audio_hw,rtkvdec,rtkdemux,rtkdemod,rtkademod,vscdev,vfedev,vbedev,vpqdev,vpqmemc,vpqleddev,vodev,vivtdev,sys-misc,sys-intmicom,se0,gdma_hal_gal0,hdcp2dev,otp,mcp/core,mcp/cipher,mcp/dgst,mcp_core,mcp_cipher,mcp_dgst,rcp_core,venus_gpio,pwm0,rtd-logger,cec0,dolbyvisionEDR0,rtk_spi,rtk_rng,rtkdelivery,irtx-0,video28,video30,video31 ucom_node=sys-intmicom waits=cec0:0xc0386106 v4l2_vsc=video30,video31 pwms=pwm-I-0,pwm-I-1,pwm-I-2,pwm-I-3,pwm-M-0,pwm-M-1,pwm-M-2,pwm-M-3 gpio_lines=460 vt=vivtdev:1920:1080:60 rpc_word=100:12070:2:0x11000 tee=1 fb=1:512x2160 vsc_screen=3840,2160 gpio_level=33:1,152:1 gpio_usb_vbus=36,151 v4l2_capture=1 rpc_reply=100:108:68 rpc_create=100:10,201:1"
# webos_tv.ko's parameters
MODULE_PARAMS_webos_tv="platform=wfm frontends=1 delsys=11+19+2 version=2.1.0 version_cmd=0x68 answers=0x80:6401 freq_cmd=0x5d status_cmd=0x81 monitor_cmd=0x71 specstore_cmd=0x56 speccheck_cmd=0x55 strength_cmd=0x60 quality_cmd=0x61 atv=2"
# dtv_soc.ko's parameters
MODULE_PARAMS_dtv_soc=""
# lgemu.ko's parameters (init adds nvm_disk=)
MODULE_PARAMS_lgemu="i2c_buses=0,1,2,3,4,5 i2c_dev=nvm:4:0x50,amp:0:0x2a,amp:0:0x2b snd_ctls=1 thermalinfo=1 iddq=150,90"
