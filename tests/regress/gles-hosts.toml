# The OpenGL ES version a guest's virgl gives on each host GPU, as measured in a guest: scripts/regress
# --tv's gles step (tests/regress/lib/tvsuite.py, judge_gles) expects a target's guest to give
# min(the TV's own version, es) on the host whose GL_RENDERER is renderer (the guest's virgl
# renderer string names it: "virgl (RENDERER)"). A host not listed here has no expectation: the step
# SKIPs and prints what it measured, which is how a row gets here. Only measured values, each with
# where it was measured; never one inferred from the host's own ES version or from the sources.

[[host]]
renderer = "D3D12 (Intel(R) UHD Graphics 770)"
es = "3.0"
source = "measured 2026-11-18: a k8hp-ombre guest (TV version 3.2) under TCG on WSL's d3d12, its default adapter, gave ES 3.0"

[[host]]
renderer = "D3D12 (NVIDIA GeForce RTX 4070 Ti)"
es = "3.1"
source = "measured 2026-11-18: a k8hp-ombre guest (before the TV-version cap; its TV version is 3.2) on WSL's d3d12 with MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA advertised ES 3.1"

[[host]]
renderer = "LLVMPIPE (LLVM 19.1.7, 256 bits)"
es = "3.2"
source = "measured 2026-11-26: an o22-ponytail guest (TV version 3.2, x86-64 guest kernel) with GALLIUM_DRIVER=llvmpipe gave ES 3.2, nothing missing, 149 extensions"

[[host]]
renderer = "V3D 7.1.7.0"
es = "3.0"
source = "measured 2026-11-26: a k8hp-ponytail guest (TV version 3.2) on a Raspberry Pi 5 gave ES 3.0; missing for 3.2: OES_geometry_shader, OES_primitive_bounding_box, OES_sample_variables, OES_tessellation_shader, OES_texture_buffer, OES_texture_cube_map_array, OES_texture_stencil8"

[[host]]
renderer = "Mali-T860 (Panfrost)"
es = "3.0"
source = "measured 2026-11-26: a k8hp-ponytail guest (TV version 3.2) on a ROCK Pi 4 (RK3399) gave ES 3.0; missing for 3.2: KHR_robustness and the same seven OES extensions as V3D"
