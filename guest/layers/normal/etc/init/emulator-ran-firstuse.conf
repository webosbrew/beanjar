# The normal layer's FirstUse marker on a state that already exists (usr/sbin/emulator-ran-firstuse,
# as emulator-ran-firstuse.service on the systemd releases). /var is the state's own partition,
# copied from the rootfs on the state's first boot only, so a state first booted without this layer
# never gets the layer's var/luna/preferences/ran-firstuse. bootd and utp start on
# (stopped mount-readwrite or mount-readwrite-done), so /var is bound by then; this task holds each
# of them back until the marker exists (bootd's mode choice and utp's skip_normal read it).
# It touches only that file, and only when it is missing.
description "Emulator: ran-firstuse marker on an existing state"

start on starting bootd or starting utp
task
console output

exec /usr/sbin/emulator-ran-firstuse
