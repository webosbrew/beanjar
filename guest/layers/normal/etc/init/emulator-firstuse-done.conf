# The normal layer's end of FirstUse on the upstart releases (usr/sbin/emulator-firstuse-done, as
# emulator-firstuse-done.service on systemd): bootManager/firstUseDone as the FirstUse app once the
# set has its country (tvservice's), the smart service country is stored where the release has
# emulator-service-country, and bootd has sent minimal-boot-done. The script waits for bootd and
# settings itself, so it starts with bootd. Nothing on a state that has ran-firstuse.
description "Emulator: the normal layer's end of FirstUse"

start on started bootd
console output

exec /usr/sbin/emulator-firstuse-done
