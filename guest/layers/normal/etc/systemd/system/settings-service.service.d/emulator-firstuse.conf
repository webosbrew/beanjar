# The normal layer: FirstUse's writes once settings is up (emulator-firstuse.service), and its end
# after them (emulator-firstuse-done.service).
[Unit]
Wants=emulator-firstuse.service emulator-firstuse-done.service

# Stock's ExecStartPost (/bin/sh -euc '/usr/bin/check_settings_db_health.py &') tests the DB
# 13 s after settings-service starts, and after three failed tries pops "Reset is needed" and
# factory-resets. is_db_initialized wants the deviceName that emulator-firstuse writes,
# which under TCG comes minutes after settings-service (it waits for the set's country), so the
# check ran too early. Run the same check once FirstUse's mark exists (at once on later boots);
# the wait is bounded in case FirstUse cannot finish.
[Service]
ExecStartPost=
ExecStartPost=/bin/sh -euc '(i=0; while [ ! -e /var/luna/preferences/emulator-firstuse ] && [ $$i -lt 450 ]; do sleep 2; i=$$((i+1)); done; exec /usr/bin/check_settings_db_health.py) &'
