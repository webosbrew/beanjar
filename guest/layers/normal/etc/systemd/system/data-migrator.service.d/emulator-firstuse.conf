# The normal layer: the stock script once surface-manager's methods have settled
# (usr/sbin/emulator-data-migrator). A new state's first boot is FirstUse, so data-migrator-init.sh
# records the platform's version (writeVersion) and data-migrator.sh migrates nothing, as on a set.
[Service]
ExecStart=
ExecStart=/usr/sbin/emulator-data-migrator
