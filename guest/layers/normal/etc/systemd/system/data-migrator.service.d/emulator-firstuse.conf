# The normal layer: a state's first boot records the platform's version, as FirstUse's boot does,
# where it starts in Normal (the headless layer's ran-firstuse) instead of migrating a blank state as
# an upgrade; otherwise the stock script, once surface-manager's methods have settled
# (usr/sbin/emulator-data-migrator).
[Service]
ExecStart=
ExecStart=/usr/sbin/emulator-data-migrator
