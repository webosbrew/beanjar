# LG's stock Qt EGLFS Starfish integration (QT_QPA_EGLFS_INTEGRATION=eglfs_starfish) owns DRM/GBM
# and input itself: no legacy EGL preload (emulator-gl.conf's libegl-kms.so). It reads the planes'
# IN_FORMATS, which virtio-gpu lists with virtio_gpu.modifiers=1 (guest/kernel/patches/0014), the
# kernel words this layer's usr/share/beanjar/kernel.cmdline gives the launcher,
# and gets one display with xrgb8888 outputs (starfish-virtio-output). Ombre's plugin commits AR24
# framebuffers whatever its output format, and the primary plane lists XR24 only:
# libkms-native-scanout's view alone (BEANJAR_NATIVE_KMS=view) gives them an XR24 view. Ponytail's
# commits the output's XR24 itself. The cursor adapter carries the stock cursor
# bitmap to the viewer.
[Service]
ExecStartPre=/usr/libexec/beanjar/starfish-virtio-output
Environment=LD_PRELOAD=/usr/lib/libkms-native-scanout.so:/usr/lib/libkms-cursor-compat.so
Environment=BEANJAR_NATIVE_KMS=view
