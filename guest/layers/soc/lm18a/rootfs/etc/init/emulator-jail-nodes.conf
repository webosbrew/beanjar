# Emulator: create the device nodes and directories the jailer needs that the VM lacks.
#
# The jailer (usr/bin/jailer, configs etc/jail_*.conf) throws on a `copynod` source it cannot stat
# or that is not a char/block device, and on a `mount` source that does not exist; the whole
# native-app launch then fails. nyx reports "lm18a", whose branch of W18A's jail_device.conf sets
# do_snd, do_nativecp, do_skylanders, uhd and mstar, as m3's. Its native jails copy OP-TEE's nodes
# besides (jail_native_builtin: /dev/tee0; jail_native_mvpd: /dev/tee0, /dev/teepriv0, /dev/cmapool,
# /dev/ion) and no /dev/umplock. makedevs (mknod.conf,
# devtmpfs.mount=1, W18R's /etc/device_table) already creates the MStar nodes (/dev/system,
# /dev/system_lg, /dev/miomap, /dev/msmailbox, /dev/semutex, /dev/demod, ...). What
# remains is made here, only where missing, so a real device always wins. A chip's list: the
# jailer's branch is the SoC's (nyx's device name), so this is the soc layer's.
#
# Char/block placeholders use the TV's real major:minor where it has one. The VM kernel has no
# driver behind those numbers, so open() fails with ENXIO. The Mali and UMP drivers, MStar's
# /dev/malloc, cmapool and ion and the eMMC's RPMB number their nodes dynamically on the TV: their
# placeholders are 0:0, which no kernel gives a driver.
#   /dev/fb0                  c 29:0     fbdev (the same number as makedevs' /dev/gfx)
#   /dev/mali0, /dev/ump      c 0:0      Mali; copynod with uhd
#   /dev/umplock, /dev/malloc c 0:0      copynod with mstar
#   /dev/cmapool, /dev/ion    c 0:0      MStar's CMA pool and ION; copynod with mstar
#   /dev/mmcblk0rpmb          c 0:0      the eMMC's replay-protected block (jail_native_builtin)
#   /dev/tee0, /dev/teepriv0  c 0:0      OP-TEE's client and supplicant nodes (no TEE here: the
#                             kdriver job, which starts tee-supplicant on the TV, loads nothing)
#   /dev/mmcblk0p19, p20, p23 (copynod): guest/initramfs/rootfs/init's nodes of the eMMC partitions,
#                             not placeholders
# Directories (bind-mount sources):
#   /dev/snd                             ALSA; only exists with a sound card (do_snd)
#   /media/cryptofs/apps/usr/palm/data/appdrm   app-DRM RODB (jail_native)
#   /tmp/dbgfrwk                         debug framework dir (jail_native_devmode/_mvpd)
#
# /media is bind-mounted from /mnt/lg/appstore by mount-readwrite, so run after it.
description "Emulator: placeholder device nodes and directories for the jailer"

start on stopped mount-readwrite

task

script
	[ -e /dev/fb0 ] || { mknod -m 0660 /dev/fb0 c 29 0; chgrp video /dev/fb0; }
	for n in mali0 ump umplock malloc cmapool ion mmcblk0rpmb tee0 teepriv0; do
		[ -e /dev/$n ] || mknod -m 0660 /dev/$n c 0 0
	done
	mkdir -p /dev/snd /media/cryptofs/apps/usr/palm/data/appdrm /tmp/dbgfrwk
end script
