# Emulator: a paired Magic Remote's record on the common data partition, made once when the state
# has none (usr/libexec/beanjar/emulator-mrcu-pairing), before lginput2 starts; webOS 4 and 4.5
# start it on bluetoothdrv-ready, after mount-readwrite (etc/systemd/system/
# emulator-mrcu-pairing.service on systemd).
description "Emulator: a paired Magic Remote's record"

start on starting lginput2

task

exec /usr/libexec/beanjar/emulator-mrcu-pairing
