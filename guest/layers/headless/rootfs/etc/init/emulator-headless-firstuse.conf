# The headless layer's ran-firstuse with the normal layer (usr/sbin/emulator-headless-firstuse, as
# emulator-headless-firstuse.service on systemd). bootd and utp start on
# (stopped mount-readwrite or mount-readwrite-done), so /var is bound by then; this task holds each
# of them back until the marker exists (bootd's mode choice and utp's skip_normal read it).
description "Emulator: headless, setup finished before bootd"

start on starting bootd or starting utp
task
console output

exec /usr/sbin/emulator-headless-firstuse
