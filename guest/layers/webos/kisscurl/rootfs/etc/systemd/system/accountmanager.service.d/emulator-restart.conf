# The stock unit has Restart=always, RestartSec=1 and StartLimitIntervalSec=0 (kisscurl, mullet and
# number1 firmware). ls-hubd launches accountmanager itself on the first call (its services.d entry is
# dynamic), so the unit's instance finds the bus name taken, exits 0 and is restarted for ever, which
# costs PID 1 a transaction each time. A clean exit stays stopped; a crash still restarts.
# ombre and later ship a unit that is not a daemon and already says on-failure.
[Service]
Restart=on-failure
