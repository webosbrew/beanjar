# Emulator: put an ext4 filesystem on blank state disks (fresh images from the launcher,
# beanjar/runtime/qemu.py) before mount-readwrite mounts them. On the TV, mount-readwrite itself runs mkfs
# when a mount fails, for the partitions it finds in /proc/partinfo as /dev/mmcblk0pN. This runs the
# same mkfs before it, on the stock fstab's /dev/mmcblk0pN, with LG's
# options (-O^huge_file -E nodiscard, as webOS 2 and 3.4), on any ext4 entry of the fstab whose
# device has no ext2/3/4 superblock magic. A disk that has one is left to mount-readwrite's
# tune2fs/e2fsck, however damaged it is.
#
# The apps partition leaves the factory with a preload/ directory (the preloaded apps' image,
# which mount-readwrite resizes on the first boot after a software burn when it holds a
# version.txt). webOS 3.5's mount-readwrite runs `find /mnt/lg/appstore/preload -name version.txt`
# in its -e script, so on an apps filesystem without preload/ the job ends there, before it
# touches $RWMOUNT_FLAG, and every process that waits in libsnapshot-boot for that file
# (tvservice's RootInit) waits forever. A new apps filesystem gets the empty directory, as the
# factory's image has it; nothing is preloaded (no version.txt, so no resize).
# The job starts on the same event as webOS 1's (mount-readwrite: start on snapshot-resume-done).
description "Emulator: mkfs.ext4 on blank state disks"

start on starting mount-readwrite
task
console output

script
	fstab=/etc/init/mount-readwrite.d/00-partinfo.ext4.fstab
	awk '!/^#/ && $3 == "ext4" { print $1, $2 }' $fstab | while read dev dir; do
		[ -b "$dev" ] || { echo "[$UPSTART_JOB] $dev: no such block device"; continue; }
		# s_magic 0xEF53, little-endian, at byte 1080 (superblock at 1024, offset 56)
		magic=$(dd if="$dev" bs=2 skip=540 count=1 2>/dev/null | od -An -tx1 | tr -d ' \n')
		[ "$magic" = 53ef ] && continue
		echo "[$UPSTART_JOB] $dev is blank: mkfs.ext4 -O^huge_file -E nodiscard"
		mkfs.ext4 -q -O^huge_file -E nodiscard "$dev" || { echo "[$UPSTART_JOB] mkfs.ext4 $dev failed"; continue; }
		if [ "$dir" = /mnt/lg/appstore ]; then
			m=/tmp/emulator-format-state.$$
			mkdir -p $m && mount -t ext4 "$dev" $m && { mkdir -p $m/preload; umount $m; } ||
				echo "[$UPSTART_JOB] $dev: no preload/ made"
			rmdir $m 2>/dev/null || true
		fi
	done
end script
