# Emulator: put an ext4 filesystem on blank state disks (fresh images from the launcher,
# beanjar/runtime/qemu.py) before mount-readwrite mounts them. On the TV, mount-readwrite itself runs mkfs
# when a mount fails, for the partitions it finds in /proc/partinfo as /dev/mmcblk0pN. This runs the
# same mkfs before it, on the stock fstab's /dev/mmcblk0pN, with LG's
# options, on any ext4 entry of the fstab whose device has no ext2/3/4 superblock magic. A disk that
# has one is left to mount-readwrite's tune2fs/e2fsck, however damaged it is. webOS 2's
# mount-readwrite adds -E nodiscard to its mkfs. The job starts on the same event as webOS 1's
# (mount-readwrite: start on snapshot-resume-done).
description "Emulator: mkfs.ext4 on blank state disks"

start on starting mount-readwrite
task
console output

script
	fstab=/etc/init/mount-readwrite.d/00-partinfo.ext4.fstab
	for dev in $(awk '!/^#/ && $3 == "ext4" { print $1 }' $fstab); do
		[ -b "$dev" ] || { echo "[$UPSTART_JOB] $dev: no such block device"; continue; }
		# s_magic 0xEF53, little-endian, at byte 1080 (superblock at 1024, offset 56)
		magic=$(dd if="$dev" bs=2 skip=540 count=1 2>/dev/null | od -An -tx1 | tr -d ' \n')
		[ "$magic" = 53ef ] && continue
		echo "[$UPSTART_JOB] $dev is blank: mkfs.ext4 -O^huge_file -E nodiscard"
		mkfs.ext4 -q -O^huge_file -E nodiscard "$dev" || echo "[$UPSTART_JOB] mkfs.ext4 $dev failed"
	done
end script
