# SAM starts after LG's Flutter zygote, as on a set. SAM opens the zygote's exit-event queue
# (/flutter-zygote-events) once, when it starts; a zygote that comes later leaves SAM without
# the exits of the Flutter apps it launches through it, so a closed app stays "closing" for good
# and every later launch of it waits (the built-in screen saver: tvpowerd then stays in Screen
# Saver Ready and refuses power calls as busy).
# A set's kernel command line has "snapshot", and snapshot-boot-components.service starts
# flutter-zygote.service before sam.service. The word is not given here: it also runs
# snapshot-boot-manager, which with this kernel's /sys/power/mode "cold" waits 60 s for clients
# that never connect and then reports "Snapshot Making Failure" to faultmanager with a reboot as
# the recovery, and tvpowerd's Quick Start checks would want a valid image in the hib partition.
# Of the firmwares studied (89), only W24G 02.68.80 ships flutter-zygote.service, so the ordering
# is given to sam.service here, in its release. sam.service is already After= the zygote.
[Unit]
Wants=flutter-zygote.service
After=flutter-zygote.service
