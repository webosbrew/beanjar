# The smart service country FirstUse leaves behind, for a set in Normal (the normal layer's
# ran-firstuse): what sdx stores offline into settings option smartServiceCountryCode2/3, the
# "Others" row of the configd group (tv.model.languageCountrySel) in its own table,
# /usr/palm/sdx/country_codes_v5.xml (EU -> EU7, CIS's CS -> EU7, KR -> KR7, ...), before tv-ready.
# W18R's and W19P's sam load their country's launch points (/usr/palm/customization/launchpoints/
# <code>) once, at core-boot-done (bootd's, after tvservice's tv-ready) once SettingsService is up,
# and reload on a change only while bootStatus is firstUse, so sdx's own value, which comes after
# tv-ready, would leave the default (Korean) list until the next boot. A set that has a country already is left alone.
# It starts with tvservice, which makes tv-ready, so it is running before any read of sam's can
# come, and waits for SettingsService itself. Not a task: tvservice does not wait for it.
description "emulator: Normal's smart service country"

start on starting tvservice

script
	[ -e /var/luna/preferences/ran-firstuse ] || exit 0
	i=0
	while :; do
		s=$(luna-send -n 1 luna://com.webos.settingsservice/getSystemSettings \
			'{"category":"option","keys":["smartServiceCountryCode3"]}' </dev/null)
		case $s in *'"returnValue":true'*|*'"returnValue": true'*) break ;; esac
		i=$((i + 1))
		[ $i -lt 600 ] || { echo "emulator-service-country: no SettingsService"; exit 0; }
		usleep 100000
	done
	case $s in *'"smartServiceCountryCode3":"other"'*|*'"smartServiceCountryCode3": "other"'*) ;; *) exit 0 ;; esac
	i=0
	while [ $i -lt 300 ]; do
		conti=$(luna-send -n 1 luna://com.webos.service.config/getConfigs \
			'{"configNames":["tv.model.languageCountrySel"]}' </dev/null |
			sed -n 's/.*"tv.model.languageCountrySel": *"\([A-Z0-9]*\)".*/\1/p')
		[ -n "$conti" ] && break
		i=$((i + 1))
		usleep 100000
	done
	code=
	[ -z "$conti" ] || code=$(sed -n "/<group code=\"$conti\"[ >]/,/<\/group>/s/.*fullname=\"Others\".*code3=\"\([^\"]*\)\".*/\1/p" \
		/usr/palm/sdx/country_codes_v5.xml)
	if [ -z "$code" ]; then
		echo "emulator-service-country: no country for group '$conti'"
		exit 0
	fi
	luna-send -n 1 luna://com.webos.settingsservice/setSystemSettings \
		"{\"category\":\"option\",\"settings\":{\"smartServiceCountryCode2\":\"$code\",\"smartServiceCountryCode3\":\"$code\"}}" </dev/null
	echo "emulator-service-country: $code"
end script
