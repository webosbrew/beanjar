# The smart service country FirstUse leaves behind, for a set in Normal (the normal layer's
# ran-firstuse): FirstUse's Next writes the selected country's alpha-2 and alpha-3 into settings
# option smartServiceCountryCode2/3 (US, USA), as a set that finished setup holds them. The stock
# default is "other", which sdx turns into the group's "Others" row of /usr/palm/sdx/country_codes_v5.xml
# (US7); LG's server answers the country check with the real country (US, USA), sdx's is_valid takes
# that as a change of country and raises "Changing the country will cause your TV to restart". So the
# board's own country is stored here, before tv-ready: its alpha-3 is settings option country, its
# alpha-2 the same row's code2 in sdx's table. W19R's sdx, on its first run (no continent recorded
# yet), stores the "Others" row over whatever is set when its configuration arrives (about 2 minutes
# into a first boot on the PC, long after tv-ready), as it does for a set not yet set up; FirstUse's
# Next on a set comes after that, so the country is stored again once, when sdx's first run has
# stored its row (waited for up to 7.5 minutes; a later change of country is the user's and stays).
# sdx validates the new value itself and normalises it, so it asks the server again.
# W18R's and W19P's sam load their country's launch points (/usr/palm/customization/launchpoints/
# <alpha-3>) once, at core-boot-done (bootd's, after tvservice's tv-ready) once SettingsService is up,
# and reload on a change only while bootStatus is firstUse, so a value that comes after tv-ready
# would leave the default (Korean) list until the next boot. A set that has a country already is left alone.
# It starts with tvservice, which makes tv-ready, so it is running before any read of sam's can
# come, and waits for SettingsService itself. Not a task: tvservice does not wait for it.
description "emulator: Normal's smart service country"

start on starting tvservice

script
	[ -e /var/luna/preferences/ran-firstuse ] || exit 0
	i=0
	while :; do
		s=$(luna-send -n 1 luna://com.webos.settingsservice/getSystemSettings \
			'{"category":"option","keys":["smartServiceCountryCode3"]}' </dev/null)
		case $s in *'"returnValue":true'*|*'"returnValue": true'*) break ;; esac
		i=$((i + 1))
		[ $i -lt 600 ] || { echo "emulator-service-country: no SettingsService"; exit 0; }
		usleep 100000
	done
	case $s in *'"smartServiceCountryCode3":"other"'*|*'"smartServiceCountryCode3": "other"'*) ;; *) exit 0 ;; esac
	i=0
	c3=
	while [ $i -lt 90 ]; do
		c3=$(luna-send -n 1 luna://com.webos.settingsservice/getSystemSettings \
			'{"category":"option","keys":["country"]}' </dev/null |
			sed -n 's/.*"country": *"\([A-Z][A-Z][A-Z]\)".*/\1/p')
		[ -n "$c3" ] && break
		i=$((i + 1))
		usleep 100000
	done
	c2=
	[ -z "$c3" ] || c2=$(sed -n "s/.*code2=\"\([A-Z]*\)\" *code3=\"$c3\".*/\1/p" \
		/usr/palm/sdx/country_codes_v5.xml | head -n 1)
	if [ -z "$c2" ]; then
		echo "emulator-service-country: no country for '$c3'"
		exit 0
	fi
	luna-send -n 1 luna://com.webos.settingsservice/setSystemSettings \
		"{\"category\":\"option\",\"settings\":{\"smartServiceCountryCode2\":\"$c2\",\"smartServiceCountryCode3\":\"$c3\"}}" </dev/null
	echo "emulator-service-country: $c2 $c3"
	# sdx's first run may store the "Others" row over it (see above): once it has, store the country
	i=0
	while [ $i -lt 90 ]; do
		usleep 5000000
		cur=$(luna-send -n 1 luna://com.webos.settingsservice/getSystemSettings \
			'{"category":"option","keys":["smartServiceCountryCode3"]}' </dev/null |
			sed -n 's/.*"smartServiceCountryCode3": *"\([^"]*\)".*/\1/p')
		[ "$cur" = "$c3" ] || [ -z "$cur" ] || break
		i=$((i + 1))
	done
	[ "$cur" != "$c3" ] && [ -n "$cur" ] && grep -q "fullname=\"Others\".*code3=\"$cur\"" /usr/palm/sdx/country_codes_v5.xml || exit 0
	luna-send -n 1 luna://com.webos.settingsservice/setSystemSettings \
		"{\"category\":\"option\",\"settings\":{\"smartServiceCountryCode2\":\"$c2\",\"smartServiceCountryCode3\":\"$c3\"}}" </dev/null
	echo "emulator-service-country: $cur -> $c2 $c3 after sdx"
end script
