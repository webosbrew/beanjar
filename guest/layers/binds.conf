# Per-file bind mounts applied by the initramfs after the overlay is assembled.
# One per line: <source, relative to the repository root> <target path inside webOS>
# At each launch the source is linked into the VM's read-only share at the same path (it must be
# one that `host/scripts/vm-launcher put` takes: host/core/beanjar/guestside/share.py PUT_ALLOWED), and this file is
# rendered there as /host/binds.conf. An edit in place shows up without rebuilding anything
# (restart the service that uses it); a rebuilt file (a new inode) needs `host/scripts/vm-launcher put SOURCE`.
#
# build/layers/h13-afro/soc/usr/lib/libdile_gal.so.1  /usr/lib/libdile_gal.so.1
