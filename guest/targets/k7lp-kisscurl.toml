# W21Z is LG's CineBeam projector on the same K7LP/kisscurl platform (HU710P family): its fstabs
# match W21P's byte for byte. It boots on W21P's target with the chip's board line (W21P retail
# identity, shared: W21Z carries no VALIDATE entry of its own). Its projector-only self power-offs
# (fan tachometers, the DMD power-good input) are answered by k7lp's GPIO chip, and its DLP
# controller by lgemu's dlpc device (soc/k7lp.toml); tv-ready still waits on legacy-broadcast's
# setPJTRProperties call to panelcontroller, and its fan monitor powers it off on the PC
# (docs/research/non-dtv-devices.md). Stays in BRING_UP.
models = ["W21P", "W21Z"]
bring_up = ["W21Z"]
v4l2_capture = true
