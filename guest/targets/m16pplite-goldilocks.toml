models = ["W18M"]
# tv.capture's video frames: lg115x.ko's de0 fills the frozen VT frame from the viewer, as on W17H
viewer_capture = true

# W18M goldilocks (05.50.60, "goldilocks-gorongosa" 4.4.3, HE_DTV_W18M_AFADJAAA, the ARIB build, the
# only W18M build held): W18H's paks named -arib, the same fstab pins and partition table (the
# `partinfo` object of tvservice-arib's lginit_app2, byte-identical to W18H's) and the same EEPROM
# records (tvservice-arib's), so m16pp-goldilocks' release rows with the -arib records.
[release]
base = "goldilocks"
state_disks = { db8 = "512M", cmn_data = "1G", appstore = "2G", uhdcp = "16M" }
peripherals = [
    "sit",
    "usbhid", "hid-axff", "hid-dr", "hid-logitech", "hid-pl", "hid-sony", "hid-zpff", "xpad",
    "uvcvideo", "usb-storage", "sd_mod", "vfat", "ntfs3", "fuse", "nls_cp437", "nls_ascii",
    "nls_utf8", "snd-usb-audio", "cdc-acm", "uhid", "input-leds",
    "hid-playstation", "ftdi_sio", "pl2303", "option", "sierra", "lgfs",
]

[release.nvm]
eeprom = "eeprom"
records = { pak = "tvservice-arib", path = "/mnt/lg/tvservice/lgapp/tvservice" }
modelinfo_offset = 0x924
modelinfo_mark = 0x20160630
model_field = [4, 24]
serial_field = [28, 17]
tooloption_offset = 0x4E4
tool_option_words = 9
tool_option_word_bytes = 4
tool_option_first = 8
tool_option_mark = 0x20150625
continent_offset = 0x1C54
continent_table = { symbol = "_aDefineContinent", size = 36 }
lastinput_offset = 0x1BC8
inputs_field = [48, 26]
factory_offset = 0x294
local_key = { word = 3, offset = 18, width = 2, names = ["joystick", "onekey", "ninekey"] }
debug_block_offset = 0x1C6

[release.partitions]
partinfo = "partinfo"
mapbak = "partinfo"
authcxt = "authcxt"
nvram = "nvram"
sestore = "sestore"
sedata = "sedata"
rootfs = "rootfs"
tvservice = "tvservice"
otncabi = "otncabi"
otycabi = "otycabi"
fonts = "fonts"
db8 = "db8"
data = "cmn_data"
apps = "appstore"
bsppart = "bsppart"
license = "license"
wossestore = "wossestore"
uhdcp = "uhdcp"
