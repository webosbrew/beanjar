# kisscurl: webOS 6.x (W21P's 6.6.0, "kisscurl-kolovesi"), a global build: jhericurl's layout with
# W21P's paks. Its stock fstabs are W20L's byte for byte (p14 cert, p30 otncabi, p31 otycabi, p32
# fonts, p34 license; p50 uhdcp, p57 db8, p58 cmn_data, p59 apps), and the paks are named for no
# region: bsppart (its bsp/ the lower), otncabi-global, otycabi-global (W21P also has rootfs,
# bspfw, fonts, tzfw, license, intmicom, boot, kernel and sedata). The same systemd 239 and
# pm-log-daemon.service, lowlevelstorage with the same seven DB regions (its own default
# records: beanjar/board/lls.py), legacy-broadcast as the TV service (now through legacy-broadcast.sh,
# which picks -dvb, -atsc or -arib by tv.nyx's tvBroadcastSystem), hw-option-gen's DDR digit
# W20L's. W21P's kernel is 4.4.84 (cap_last_cap 37, read from its kallsyms). Its partition map:
# see-init's table is W20L's stale one byte for byte, and every index W21P pins is one
# jhericurl's map has, so the map is that one with W21P's paks' sizes. Its product.env selects
# imspecialkeys cursor visibility (WEBOS_CURSOR_VISIBLE_EVENT), as W21A's and W21Z's do: without
# the wakeup pulse libim keeps the cursor hidden at (0,0) and the pointer cannot aim.

base = "jhericurl"
version = "6"
pointer_wakeup = true
paks = [
    { file = "rootfs", serial = "rootfs", mount = "/" },
    { file = "bsppart", serial = "bsppart" },
    { file = "otncabi-global", serial = "otncabi", mount = "/mnt/otncabi" },
    { file = "otycabi-global", serial = "otycabi", mount = "/mnt/otycabi" },
    { file = "fonts", serial = "fonts", mount = "/mnt/fonts" },
    { file = "license", serial = "license", mount = "/mnt/license" },
]
partmap = "kisscurl"
