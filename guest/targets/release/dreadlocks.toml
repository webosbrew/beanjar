# dreadlocks: webOS 3.0-3.4 (W16R's 3.4.3, "dreadlocks-digya"): the six paks at webOS 1's mount points (W16R's
# mount-readonly-volatile.d/00-partinfo.squashfs.fstab: p28 tvservice, p30 otncabi, p31 otycabi,
# p32 fonts, p33 smartkey) and license at /mnt/license (p35; SetInitEnv puts its usr/lib on
# LD_LIBRARY_PATH, libMotionEngine*). bsppart is not mounted at a point: its mount-bsp job
# overlays the pak's bsp/ over / and pivots into it, which init does at once by stacking bsp/
# above the rootfs (guest/layers/webos/dreadlocks's mount-bsp.override). boot.pak (MBoot), kernel.pak and
# tzfw.pak are the bootloader's, the kernel and the TEE's, which nothing in the userland mounts.
# The same three state partitions (mount-readwrite.d/00-partinfo.ext4.fstab, p50-p52), the job
# PmLogDaemon.conf and both trust bundles and the hashed directory in its rootfs.

base = "beehive"
version = "3"
pmlog_mode = "devlog"
# W16R and W18R (modules.builtin): those and codepage 949
# W16R, W18R (modules.builtin, snd-usb-audio a module): uhid and joydev, the HID drivers
# DragonRise, Logitech, Sony, Zeroplus; W18R also input-leds
peripherals = [
    "sit",
    "usbhid", "uhid", "joydev", "hid-dr", "hid-logitech", "hid-sony", "hid-zpff", "xpad",
    "uvcvideo", "usb-storage", "sd_mod", "vfat", "ntfs3", "fuse", "nls_cp437", "nls_ascii",
    "nls_utf8", "nls_iso8859-1", "nls_cp949", "snd-usb-audio", "cdc-acm", "ipw", "pl2303",
    "option", "sierra", "lgfs",
]
paks = [
    { file = "rootfs", serial = "rootfs", mount = "/" },
    { file = "bsppart", serial = "bsppart" },
    { file = "tvservice-dvb", serial = "tvservice", mount = "/mnt/tvservice" },
    { file = "otncabi-dvb", serial = "otncabi", mount = "/mnt/otncabi" },
    { file = "otycabi-dvb", serial = "otycabi", mount = "/mnt/otycabi" },
    { file = "fonts", serial = "fonts", mount = "/mnt/fonts" },
    { file = "smartkey", serial = "smartkey", mount = "/mnt/smartkey" },
    { file = "license", serial = "license", mount = "/mnt/license" },
]
pak_lowers = [{ serial = "bsppart", subdir = "bsp" }]

# The ToolOptionDB still at 0x4E4 (and the ModelInfoDB at 0x924, 44 bytes, as before), but
# 76 bytes with the valid mark 0x20150625, a word at +4, and ToolOption1..9 as 32-bit words
# at +8..+43 (tvconfig-gen's OSA_MD_GetToolOption reads ToolOption1..7 at 0x4EC..0x504 and
# ToolOption9 at 0x50C; +36 is ToolOption8, which MBoot prints too). tvconfig-gen aborts on a
# blank ContinentOptionDB (0x1BD4, 40 bytes: "Continent idx is out range 127"), so a new
# EEPROM gets one, as a factory's has one: the default record with the model's area and its
# option words from _aDefineContinent (a file-local object: .symtab; entries of 36 bytes, a
# name pointer, 15 16-bit words and padding, DWARF's continent_info). The records are tvservice's
# (tvconfig-gen, the first reader of the EEPROM at boot, has the same three).
# The Last_Input_info DB (0x1B48, 44 bytes, mark 0x20130001) is written by webOS 3's
# tvservice only in factory mode or while FirstUse has not run
# (DIL_NVM_PWRON_InitLastInfo(tv_sysonoff_isAvailableFirstUseApp())); webOS 1 and 2 write it
# whenever its mark is wrong. A set leaves the factory with it, so a new EEPROM gets the
# default record; blank, a state booted with the normal layer (FirstUse ran) had no last
# input and bootd no first app.
# The local key type: ToolOption3's eLocalKeyType:1 at bit 18 (W16R's TOOL_OPTION3_T,
# TVCO_CFG_LOCAL_KEY_TYPE_T JOYSTICK 0, ONEKEY 1; TVCO_CFG_ID_TOOLOPT3_LOCAL_KEY_TYPE). Its
# onekey is a power key only (_MICOM_GetLocalKeyValue: 0xEA to 924).
[nvm]
eeprom = "eeprom"
records = { pak = "tvservice-dvb", path = "/mnt/lg/tvservice/lgapp/tvservice" }
modelinfo_offset = 0x924
modelinfo_mark = 0x20130002
model_field = [4, 13]
serial_field = [17, 17]
tooloption_offset = 0x4E4
tool_option_words = 9
tool_option_word_bytes = 4
tool_option_first = 8
tool_option_mark = 0x20150625
continent_offset = 0x1BD4
continent_table = { symbol = "_aDefineContinent", size = 36 }
lastinput_offset = 0x1B48
factory_offset = 0x294
local_key = { word = 3, offset = 18, width = 1, names = ["joystick", "onekey"] }
debug_status_offset = 0x1A1

# the map's bsppart (mount-bsp's) and license as well (W16R's table: 52 partitions, partinfo p3)
[partitions]
partinfo = "partinfo"
mapbak = "partinfo"
authcxt = "authcxt"
nvram = "nvram"
sestore = "sestore"
sedata = "sedata"
rootfs = "rootfs"
tvservice = "tvservice"
otncabi = "otncabi"
otycabi = "otycabi"
fonts = "fonts"
smartkey = "smartkey"
db8 = "db8"
data = "cmn_data"
apps = "appstore"
bsppart = "bsppart"
license = "license"
