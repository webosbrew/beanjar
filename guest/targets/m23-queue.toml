models = ["W23M"]
lg_scaler = [3840, 2160]
v4l2_capture = true
de_histogram = true

# W23M queue-qilian (43.22.75, the global build): ponytail's pins with the jails' secure-store pins
# down by two (p17, p18, p21, p24, as every queue firmware); no appackage.pak (W22O queue has one);
# no legacy DILE libraries (soc layer: halgal_stock_fails).
[release]
base = "queue"
nvm_disks = { nvram = "8M", eeprom = "32K" }
partmap = "m23-ponytail"

# The tuners, as on ponytail (o22-ponytail.toml; W22O queue 43.21.89 checked live): W22O's global firmware boots the US C2 (soc/o22.toml), whose broadcast stack is
# W21P's: LG's wfm webos_tv (the stock firmware loads it, webos-tv.service) with the ATSC DTV SoC
# demodulator under legacy-broadcast-atsc, which reaches the tuner through libdil_tu_plugin
# (dil_config.json); its compare_dvbfrontend_version wants 2.1, its US board has one frontend
# (tv.hw: no supportDualTuner nor supportTripleTuner) with atsc_dtv_soc.ko's systems (0b 13 02)
# and the analog tuner's /dev/video2, and it names the lock's properties as K8LPN's plugin does
# (soc/k8lpn.toml). dtv_soc brings the signal, the demuxes and the video decoder (/dev/video20).
[soc]
base = "m23"
# M23's own lg115x row (soc/m23.toml), restated: a [soc] row's modules replace its base's

[[soc.modules]]
name = "lg115x"
params = [
    "chip_rev=0x27a0",
    "ace_rev=0x27a0",
    "platform=0x2000",
    "graphic_res=0x07800438",
    "board_opt=0x02510144",
    "ucom=1",
    "gpio_lines=144",
    "gpio_level=18:1,10:1",
]

[[soc.modules]]
name = "webos_tv"
params = [
    "platform=wfm",
    "frontends=1",
    "delsys=11+19+2",
    "version=2.1.0",
    "version_cmd=0x68",
    "answers=0x80:6401",
    "freq_cmd=0x5d",
    "status_cmd=0x81",
    "monitor_cmd=0x71",
    "specstore_cmd=0x56",
    "speccheck_cmd=0x55",
    "strength_cmd=0x60",
    "quality_cmd=0x61",
    "atv=2",
]

[[soc.modules]]
name = "dtv_soc"
