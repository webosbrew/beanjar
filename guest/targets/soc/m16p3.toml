# The LG M16P3 (the firmware's machine name m16p3; LG1314, "M19" to its kernel and lxboot), W19H's
# SoC: M16PP's platform (guest/targets/soc/m16pp.toml says where each of its values comes from) on
# W19H 05.50.00's AArch64 4.4.84 kernel (4.4.84-169.gld4tv.5) and goldilocks2 userland, with its own
# board, a 55SM9000PUA (board.cmdline). What differs from M16PP, each from W19H's own files:
# - CHIP_REV 0x23a0: the kernel's chip_list ends with M19 0x23 (after O18 0x22), BASE_Init reads
#   chip=M19A0 as id 0x23, revision A0, and the kernel has M19 A0 paths only (LX_CHIP_REV(M19, A0));
#   ACE_REV the same without ace=. W19H's KADP and HAL_VT take their C0-and-later paths
#   (>= 0x19c0) and their own >= M19 A0 ones. BASE_PLT_Probe as W18H's: UHD (hwopt digit 3 '2'),
#   120 Hz (digit 4 '1'), DDR 1.5 GB (digit 11 '3', 0x208000), FRC built in 0x4, LCD 0x20
#   (modelopt 6-9 "0000"), always 0x2000000: BOARD_OPT 0x2A08024, CHIP_PLT 0x2000.
# - The security engine: SE_InitCfg's M19 row of gMemCfgSE and gMemCfgSE_TZFW, the same regions as
#   W18H's; the netlink family 31 the built-in SE_Init creates (se_kadpd is now its own bsppart
#   binary, which kadpd execs).
# - The display engine: DE_REG_M19_GetCapacity is DE_REG_M17_GetCapacity's code (the 1.5 GB VT
#   limit), and KADP's VTM, source status and FPP structures are W18H's. W19H's HAL_VT no longer
#   asks the DE firmware's version, so de_fw_version is not given.
# - The audio master: W18H's numbers (GET_KDRV_HANDLE 27, GET_EVENT 76, processing status 66/67).
#   KADP_AUDIO_OpenMaster no longer downloads the DSP: the rootfs job firmware_audio's fwload_audio
#   does (nr 182, 28, 27 on amst0); the emulator has no DSP and the job is left stock.
# - The BE: renumbered as O20's: no GET_FIRMWARE_INFO_ADDR at all (be's 0), REG_ACCESS nr 16
#   (0xc0104410), LED_GET_REG_INFO nr 45 (0x8038442d) with BE_LED_HW_M19_Get_RegInfo's block,
#   M17's values.
# - KADP's logm objects are 84 bytes, as W18H's.
# - I2C and GPIO through Linux devices as on W18H (KADP_I2C_Open and KADP_GPIO_Init are W18H's
#   code). The map is libdile_i2c's gsI2cAllConf: MICOM 1:0x52, NVM 4:0xA0, the one NTP7518
#   amplifier tvservice drives for RELEASE.cfg's AMP_NTP7519_1AMP at 0:0x54, at 7-bit addresses;
#   the device tree's 18 pl061 controllers, 144 GPIO lines.

base = "m16pp"
board_cmdline = "/etc/emulator/board.cmdline"
# The 55SM9000PUA's area, a US set's (board.cmdline): W19H's _aDefineContinent entry 10 ("US", in
# the RMM country list of the US group), LANG_COUNTRY_US 14, HWSETTING_US 5
continent = [10, 14, 5]
# Its input ports, EXT_VIDEO_INPUT_ADJ and EXT_AUDIO_INPUT_ADJ of tvservice's gToolOptionDB, from
# W19H's RELEASE.cfg (SM85 defaults), read by host/tools/research/model-config.py
inputs = [1, 2, 3, 4, 1, 0, 0, 1, 0, 2, 0, 0, 0, 0, 0, 2, 0, 0, 4, 3, 2, 1, 0, 0, 0, 0]
# W19H's KADP's Linux I2C adapters (above): micom on 1, the NVM on 4, the amplifier on 0
lgemu = ["i2c_buses=0,1,2,3,4,5", "i2c_dev=micom:1:0x29,nvm:4:0x50,amp:0:0x2a"]

[[modules]]
name = "lg115x"
params = [
    "chip_rev=0x23a0",
    "ace_rev=0x23a0",
    "platform=0x2000",
    "graphic_res=0x07800438",
    "board_opt=0x2a08024",
    "spi_cs=2",
    "se_mem=0x7e900000:0x500000",
    "se_tzfw=0x7ee00000:0x1200000",
    "se_netlink=31",
    "logm_obj=84",
    "de_mem=0x7d900000:0x1000000",
    "de_capacity=6:4:4:3840:2160:3840:2160:0:60:2:1:1920:1080:0:1:1:1:3840:2160:1:320:240:2",
    "de_panel=4",
    "de_vtm_buffers=5",
    "de_src_status=56",
    "gpio_lines=144",
    "pe_hdr=0x7d700000",
    "amst=27:76:23:66:67",
    "be=0:16",
    "be_led=45:0xc9020000:0xc9020000:0x4c0:0x4c4:0x4c8:0x4e4:0x4e8:0x4dc:0x4e0:0x4cc:0x4d0:0x4d4:0x4d8:0x290",
]

# W19H's libdvbfrontend (HAL_DVBV5_*): GetLIBVersion, CheckLockState and TunePostJob read 0xc1,
# 0xaf and 0xb1, as W19R's
[[modules]]
name = "webos_tv"
params = [
    "version_cmd=0xc1",
    "lock_cmd=0xaf",
    "postjob_cmd=0xb1",
]
