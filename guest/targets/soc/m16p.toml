# The LG M16P (LG1313), W17H's SoC: LG's kdrivers again (lg115x.ko), on M16P's 4.4.3 kernel.
# Its BASE_Init looks chip=M16PB0 up as id 0x19 (the M17's), so CHIP_REV 0x19b0; ACE_REV the
# same without ace=. BASE_PLT_Probe: CHIP_PLT 0x2000 (only pioneer.boardopts=FHD gives 0x1000),
# BOARD_OPT 0x200000 | DDR from hwopt digit 11 ('3': 1.5 GB STD, 0x24000) | FRC internal 0x4 |
# panel LCD 0x20 (modelopt digit 6 not '1'): 0x224024, the file only M16P's kernel has;
# GFX_RES a constant 1920x1080. W17H's RELEASE.cfg "[i2c]MICOM:2:0x52:0", "[i2c]NVM:5:0xA0:1"
# and the two NTP7515s of the AMP_NTP7515_2AMP ToolOpt3 selects, "[i2c]NTP7515_2AMP_F:1:0x54"
# and "_W:1:0x56" (iic0); KADP_I2C_* use lg115x's ABI. Its
# device_table has spidev0.0 and 0.1, as H13's and M14's. Its security engine (/dev/lg/se0,
# KADP's gateway to TrustZone) with M16P's regions, the kernel's gMemCfgSE and
# gMemCfgSE_TZFW (se_cfg.c's M16P rows, the same in W17H's kernel): KADP's SE client leaks its
# process-shared lock when it cannot open the device, and tvservice's init (DASY's secure key),
# securitymanager and hdcp2 then wait on it forever. W17H's KADP's logm objects are 84 bytes
# (user and hidden masks; KADP_LOGM_WriteLog's stride 0x54).
# Its display engine (/dev/lg/de0, HAL_VT's capture): de_capacity is M17's
# DE_REG_M17_GetCapacity, the 1.5 GB branch (BOARD_OPT's DDR): chip 6, 4 windows and layers,
# 3840x2160 in and out, out 60 Hz, mvir 2, 3D out SINGLE_TB, VT up to 1920x1080, no left-top
# align, display de-interlacing, scaling up to 3840x2160 and down to 320x240, both locations;
# de_panel LX_PANEL_TYPE_3840 (the UD panel). de_mem is the emulator's: below the SE region,
# above HAL_VT's 0x50000000 floor for a frame address. M17's 144 GPIO pins.
# pe_hdr is M17's HDR LUT map (PE_HDR_DDR_M17_BASE_ADDR, 2 MiB into the BE's IPC firmware
# region, which the stock kernel places at boot): the emulator's, below de_mem.
# The audio master: the 2016 audio_kapi_master.h's GET_KDRV_HANDLE nr 27 and GET_EVENT nr 71
# (0x80044d1b, 0xc0084d47 in W17H's KADP), LX_AUD_DEV_MAS0 23, and the audio processing
# status (nr 66, its query 67) kept as set; SET_SE_FN nr 60 (amst_se), the OSD volume for
# lgemu's playback gain. The BE: the 2016 be_kapi.h's
# GET_FIRMWARE_INFO_ADDR nr 24 and REG_ACCESS nr 22 (0x80084418, 0xc0104416), and M17's LED
# register block for LED_GET_REG_INFO nr 53, 0x80384435 (BE_LED_HW_M17_Get_RegInfo:
# DPE_LED_REG_M17A0_BASE and the offsets in DPE_LED_REG_M17A0_T, be_reg_dpe_m17a0.h).

board_cmdline = "/etc/emulator/board.cmdline"
# The 55UJ750V's area as the 43LH604V's: W17H's RELEASE.cfg nContinentIdx 50 ("DE" in its
# tvservice's _aDefineContinent), LANG_COUNTRY_EU 24, HWSETTING_EU 0 (its DWARF)
continent = [50, 24, 0]

[[modules]]
name = "lg115x"
params = [
    "chip_rev=0x19b0",
    "ace_rev=0x19b0",
    "platform=0x2000",
    "graphic_res=0x07800438",
    "board_opt=0x224024",
    "i2c=micom:1:0x52,nvm:4:0xa0,amp:0:0x54,amp:0:0x56",
    "spi_cs=2",
    "se_mem=0x7f100000:0x700000",
    "se_tzfw=0x7f800000:0x800000",
    "logm_obj=84",
    "de_mem=0x7e000000:0x1000000",
    "de_capacity=6:4:4:3840:2160:3840:2160:0:60:2:1:1920:1080:0:0:1:1:3840:2160:1:320:240:2",
    "de_panel=4",
    "gpio_pins=144",
    "pe_hdr=0x7de00000",
    "amst=27:71:23:66:67",
    "amst_se=60",
    "be=24:22",
    "be_led=53:0xc9020000:0xc9020000:0x4c0:0x4c4:0x4c8:0x4e4:0x4e8:0x4dc:0x4e0:0x4cc:0x4d0:0x4d4:0x4d8:0x290",
]
