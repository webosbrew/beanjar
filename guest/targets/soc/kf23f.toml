# The Realtek "KF23F" (U-Boot's chip=KF23FA0, the firmware's machine name kf23f), W23L's SoC: an
# HD sibling of K8LPN (W23P) with a Mali GPU (docs/research/m2r-kf23f-groundwork.md). W23L 13.50.75's
# libkadaptor keeps W23P's pli_* functions, /dev/auth, the 90 kHz clock registers and the RPC table
# (rpc-table: byte-identical), its device nodes are W23P's, and its kernel modules are W23P's set
# apart from Wi-Fi and Bluetooth; so the rtk module's parameters are K8LPN's but for:
# - the panel: 1366x768 LVDS, the graphic plane 1280x720 (vt, vsc_screen), as K8AP's (W22L) HD set;
# - the GPIO lines of W23L's libdile_gpio (map version 221205): USB1_OCD 8 and USB2_OCD 439 read 1
#   (active low: no overcurrent), USB1_CTRL 20 and USB2_CTRL 438 the ports' power switches; the
#   highest line is 449 (HDMI3_DEV_DET), below gpio_lines.
# The I2C map is W23L's libdile_i2c (33 entries): the NVM on channel 0 (8-bit slave 0xA0, W23P's
# channel 4), the amplifiers on channel 0 at 0x54 and 0x56 (as W23P), the light sensors on channel 2
# (8-bit 0x20, W23P's channel 5). DILE_I2C opens buses 0 to 5.
# The tuner: W23L's legacy-broadcast reaches it through libdil_tu_plugin, whose
# compare_dvbfrontend_version accepts 2.1 only (property 0x68), K8LPN's webos_tv answer; W23P
# number1's own consumer wants 1.2 (targets/k8lpn-number1.toml), W23L's does not.
# The GPU is Mali Bifrost r17p0 (bsppart's libmali.so.0.17.0, as K7LP's W21P), not K8LPN's PowerVR:
# the gl layer's Mali stand-in (guest/layers/soc/kf23f/meson.build).

base = "k8lpn"
# The US board by default (board-atsc.cmdline), the DVB board of the same hardware on request
board_cmdline = "/etc/emulator/board-atsc.cmdline"
broadcast_boards = { atsc = "/etc/emulator/board-atsc.cmdline", dvb = "/etc/emulator/board-dvb.cmdline" }
lgemu = [
    "i2c_buses=0,1,2,3,4,5", "i2c_dev=nvm:0:0x50,amp:0:0x2a,amp:0:0x2b", "snd_ctls=1",
]
light_bus = 2

[[modules]]
name = "rtk"
params = [
    "rbus_phys=0x18000000",
    "rbus_size=0x80000",
    "pli_base=0x20000000",
    "pli_max=0x60000000",
    "pli_step=0x8000000",
    "pli_rbus=0x10000000",
    "pli_window=0x8000000",
    "pli_uncached=0x8000000",
    "pli_pad=0x10000",
    "dcu1_base=0x20000000",
    "dcu1_size=0x20000000",
    "dcu2_base=0x40000000",
    "dcu2_size=0x20000000",
    "clock90k=0xb801b6b8,0xb801b6bc",
    """nodes=rtkaudio,audio_hw,rtkvdec,rtkdemux,rtkdemod,rtkademod,vscdev,vfedev,vbedev,vpqdev,\
        vpqmemc,vpqleddev,vodev,vivtdev,sys-misc,sys-intmicom,se0,gdma_hal_gal0,hdcp2dev,otp,\
        mcp/core,mcp/cipher,mcp/dgst,mcp_core,mcp_cipher,mcp_dgst,rcp_core,venus_gpio,pwm0,\
        rtd-logger,cec0,dolbyvisionEDR0,rtk_spi,rtk_rng,rtkdelivery,irtx-0,video28,video30,video31""",
    "ucom_node=sys-intmicom",
    "waits=cec0:0xc0386106",
    "v4l2_vsc=video30,video31",
    "pwms=pwm-I-0,pwm-I-1,pwm-I-2,pwm-I-3,pwm-M-0,pwm-M-1,pwm-M-2,pwm-M-3",
    "gpio_lines=460",
    "vt=vivtdev:1280:720:60",
    "rpc_word=100:12070:2:0x11000",
    "tee=1",
    "fb=1:512x2160",
    "vsc_screen=1366,768",
    "gpio_level=8:1,439:1",
    "gpio_usb_vbus=20,438",
]
derived = "rpc-table"

# K8LPN's tuner boundary (a soc's modules replace its base's): the version 2.1 that W23L's
# libdil_tu_plugin accepts, and the properties it names (soc/k8lpn.toml)
[[modules]]
name = "webos_tv"
params = [
    "platform=wfm",
    "frontends=2",
    "delsys=3+16+1+2+5+6+18,3+16+1+2+5+6+18",
    "version=2.1.0",
    "version_cmd=0x68",
    "answers=0x80:6401",
    "freq_cmd=0x5d",
    "status_cmd=0x81",
    "monitor_cmd=0x71",
    "specstore_cmd=0x56",
    "speccheck_cmd=0x55",
    "strength_cmd=0x60",
    "quality_cmd=0x61",
    "atv=2",
]

# the frontends' signal, the demuxes and the video decoder, fed from the host's tuner (beanjar io
# tuner, host/core/beanjar/tuner.py)
[[modules]]
name = "dtv_soc"

[broadcast_params.atsc]
webos_tv = ["frontends=1", "delsys=11+19+2"]
