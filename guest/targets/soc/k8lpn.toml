# W23P's NVM and two-amp addresses match K8HPP, while DILE opens only buses 0..5; no retail board
# image is borrowed.
# The tuners, W23P ombre (23.25.55), ponytail (33.31.61) and queue (43.22.76): its global firmware
# boots its US model (soc/k7lp.toml), whose broadcast stack is W21P's, LG's wfm webos_tv with the
# ATSC DTV SoC demodulator under legacy-broadcast-atsc, which reaches the tuner through
# libdil_tu_plugin (dil_config.json). Its compare_dvbfrontend_version wants 2.1 (major 2, minor 1;
# property 0x68), as W21P's. It names the lock's properties (gDTV_EXT_CMD_NAME: EXT_GET_LOCK_STATUS
# 0x81, EXT_GET_TUNED_FREQUENCY 0x5d, the special data 0x55 and 0x56, strength and quality 0x60 and
# 0x61) and keeps the version, the monitor 0x71 and the post job 0x80 numbered; webos_tv answers
# both forms. The US board's frontend is W21P's: one (tv.hw has neither supportDualTuner nor
# supportTripleTuner, FE_CheckTunerCount), the systems of each release's atsc_dtv_soc.ko (.data:
# 0b 13 02, SYS_ATSC, SYS_ATSC3, SYS_DVBC_ANNEX_B), and the analog tuner's /dev/video2, which
# FE_ATV_Initialize opens before the digital ones. dtv_soc brings the signal, the demuxes and the
# video decoder (/dev/video20, which legacy-broadcast-atsc opens on ombre and ponytail and
# nyxVdec.module on queue). W23P number1 has the same tuner through K8HPP's values (targets/k8lpn-number1.toml).
base = "k8hpp"
# earc=1 as K8LP's
lgemu = [
    "i2c_buses=0,1,2,3,4,5", "i2c_dev=nvm:4:0x50,amp:0:0x2a,amp:0:0x2b", "snd_ctls=1", "earc=1",
]

# gpio_usb_vbus and gpio_level: the USB ports' power switches and overcurrent inputs
# (soc/k6lp.toml says how they were read)
[[modules]]
name = "rtk"
params = [
    "rbus_phys=0x18000000",
    "rbus_size=0x80000",
    "pli_base=0x20000000",
    "pli_max=0x60000000",
    "pli_step=0x8000000",
    "pli_rbus=0x10000000",
    "pli_window=0x8000000",
    "pli_uncached=0x8000000",
    "pli_pad=0x10000",
    "dcu1_base=0x20000000",
    "dcu1_size=0x20000000",
    "dcu2_base=0x40000000",
    "dcu2_size=0x20000000",
    "clock90k=0xb801b6b8,0xb801b6bc",
    """nodes=rtkaudio,audio_hw,rtkvdec,rtkdemux,rtkdemod,rtkademod,vscdev,vfedev,vbedev,vpqdev,\
        vpqmemc,vpqleddev,vodev,vivtdev,sys-misc,sys-intmicom,se0,gdma_hal_gal0,hdcp2dev,otp,\
        mcp/core,mcp/cipher,mcp/dgst,mcp_core,mcp_cipher,mcp_dgst,rcp_core,venus_gpio,pwm0,\
        rtd-logger,cec0,dolbyvisionEDR0,rtk_spi,rtk_rng,rtkdelivery,irtx-0,video28,video30,video31""",
    "ucom_node=sys-intmicom",
    "waits=cec0:0xc0386106",
    "v4l2_vsc=video30,video31",
    "pwms=pwm-I-0,pwm-I-1,pwm-I-2,pwm-I-3,pwm-M-0,pwm-M-1,pwm-M-2,pwm-M-3",
    "gpio_lines=460",
    "vt=vivtdev:1920:1080:60",
    "rpc_word=100:12070:2:0x11000",
    "tee=1",
    "fb=1:512x2160",
    "vsc_screen=3840,2160",
    "gpio_level=33:1,152:1",
    "gpio_usb_vbus=36,151",
]
derived = "rpc-table"

[[modules]]
name = "webos_tv"
params = [
    "platform=wfm",
    "frontends=2",
    "delsys=3+16+1+2+5+6+18,3+16+1+2+5+6+18",
    "version=2.1.0",
    "version_cmd=0x68",
    "answers=0x80:6401",
    "freq_cmd=0x5d",
    "status_cmd=0x81",
    "monitor_cmd=0x71",
    "specstore_cmd=0x56",
    "speccheck_cmd=0x55",
    "strength_cmd=0x60",
    "quality_cmd=0x61",
    "atv=2",
]

# the frontends' signal, the demuxes and the video decoder, fed from the host's tuner (beanjar io
# tuner, host/core/beanjar/tuner.py)
[[modules]]
name = "dtv_soc"

[broadcast_params.atsc]
webos_tv = ["frontends=1", "delsys=11+19+2"]
