# The Realtek "K25LP" (W25P's SoC; its U-Boot passes chip=K25, "LGE K8 Board"): K8LPN2's platform.
# W25P's bsppart libkadaptor is K8LPN2's KADP (the same /dev nodes, PLI and auth calls; the same
# RPC answer table, rpc-table), libhal_ucom, libhal_sys and libhalgal are K8LPN2's builds, and the
# GPU is K8LPN2's PowerVR. Its I2C table (libdile_i2c on ponytail, nyxI2c on queue) is
# K8LPN2's without the SN5822, IT6265 and SIL9437 rows: NVM 4/0xA0, the amplifiers 0/0x54 and
# 0x56, LIGHT_SENSOR_1/2 on 5; DILE_I2C opens /dev/i2c-0 to -5 (cmp r4, #6). libdil_tu_plugin is
# K8LPN2's build of each release (compare_dvbfrontend_version: 2.1, property 0x68), so webos_tv
# and dtv_soc are K8LPN2's, which carries K8LPN's ATSC tuner values (soc/k8lpn.toml): W25P queue's
# legacy-broadcast-atsc thread tFEMain reads the post job property 0x80 and spins when webos_tv
# does not answer it (answers=0x80:6401), as it did with the former European values.

base = "k8lpn2"

# gpio_usb_vbus and gpio_level: the USB ports' power switches and overcurrent inputs
# (soc/k6lp.toml says how they were read): W25P 33.31.61's libdile_gpio and 43.22.74's
# nyxGpio.module, the same tables: USB1_CTRL 427, USB2_CTRL 36, USB1_OCD 428, USB2_OCD 33; the
# highest line 451 (HDMI1_DEV_DET), as on K8LPN2
[[modules]]
name = "rtk"
params = [
    "rbus_phys=0x18000000",
    "rbus_size=0x80000",
    "pli_base=0x20000000",
    "pli_max=0x60000000",
    "pli_step=0x8000000",
    "pli_rbus=0x10000000",
    "pli_window=0x8000000",
    "pli_uncached=0x8000000",
    "pli_pad=0x10000",
    "dcu1_base=0x20000000",
    "dcu1_size=0x20000000",
    "dcu2_base=0x40000000",
    "dcu2_size=0x20000000",
    "clock90k=0xb801b6b8,0xb801b6bc",
    """nodes=rtkaudio,audio_hw,rtkvdec,rtkdemux,rtkdemod,rtkademod,vscdev,vfedev,vbedev,vpqdev,\
        vpqmemc,vpqleddev,vodev,vivtdev,sys-misc,sys-intmicom,se0,gdma_hal_gal0,hdcp2dev,otp,\
        mcp/core,mcp/cipher,mcp/dgst,mcp_core,mcp_cipher,mcp_dgst,rcp_core,venus_gpio,pwm0,\
        rtd-logger,cec0,dolbyvisionEDR0,rtk_spi,rtk_rng,rtkdelivery,irtx-0,video28,video30,video31""",
    "ucom_node=sys-intmicom",
    "waits=cec0:0xc0386106",
    "v4l2_vsc=video30,video31",
    "pwms=pwm-I-0,pwm-I-1,pwm-I-2,pwm-I-3,pwm-M-0,pwm-M-1,pwm-M-2,pwm-M-3",
    "gpio_lines=460",
    "vt=vivtdev:1920:1080:60",
    "rpc_word=100:12070:2:0x11000",
    "tee=1",
    "fb=1:512x2160",
    "vsc_screen=3840,2160",
    "gpio_level=428:1,33:1",
    "gpio_usb_vbus=427,36",
]
derived = "rpc-table"

[[modules]]
name = "webos_tv"
params = [
    "platform=wfm",
    "frontends=2",
    "delsys=3+16+1+2+5+6+18,3+16+1+2+5+6+18",
    "version=2.1.0",
    "version_cmd=0x68",
    "answers=0x80:6401",
    "freq_cmd=0x5d",
    "status_cmd=0x81",
    "monitor_cmd=0x71",
    "specstore_cmd=0x56",
    "speccheck_cmd=0x55",
    "strength_cmd=0x60",
    "quality_cmd=0x61",
    "atv=2",
]

[[modules]]
name = "dtv_soc"

[broadcast_params.atsc]
webos_tv = ["frontends=1", "delsys=11+19+2"]
