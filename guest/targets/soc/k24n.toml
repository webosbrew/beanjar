# The Realtek "K24N" (W25H's SoC; its U-Boot passes chip=K24N, "LGE K8 Board"): K24's platform.
# W25H's bsppart libkadaptor, libhal_sys and libhal_rtd2872 are other builds than W24H's with the
# same exports and /dev, /sys and /proc names, and the same RPC answer table (rpc-table); its I2C
# table, DILE_I2C's seven adapters, libdil_tu_plugin (2.1) and every fstab and jail pin are W24H's.
# Its libdile_gpio (33.31.68) keeps K24's lines, USB ones and HDMI detects included, and adds the
# LNB outputs GPIO_WR_LNB_14V_19V 29 and GPIO_WR_LNB_EN 2: K24's rtk row serves them all
# (soc/k24.toml).

base = "k24"
# Its only queue firmware is the Japanese ARIB build (W25H 43.22.66), whose model_id.json says
# ARIB: it boots the Japanese OLED55B5PJA (board-arib.cmdline), from that firmware's own generators.
broadcast_boards = { atsc = "/etc/emulator/board-atsc.cmdline", dvb = "/etc/emulator/board-dvb.cmdline", arib = "/etc/emulator/board-arib.cmdline" }
# No tuner yet (K24's US one, soc/k24.toml, is not enabled here): on ponytail (W25H 33.31.68)
# surface-manager-daemon restarts in a loop and the scan ends at once with no channel; the queue
# board is the Japanese ARIB one, which is not emulated. K24's rtk row and the tuner values it had
# before.
broadcast_params = {}
# The tune post job, though: libdil_tu_plugin's FE thread (legacy-broadcast's tFEMain) reads
# property 0x80 after each tune step and, answered zeroes, steps again at once. With no tuner every
# tune still steps: a scan on ponytail made 33,000 reads a second at 68 % of a core, and a tune
# Live TV kept open did the same at idle (73 %). 0x80's answer (6401: the next step in 100 ms,
# finished) is K24's and K8LPN's (soc/k25lp.toml, the same spin).


[[modules]]
name = "rtk"
params = [
    "rbus_phys=0x18000000",
    "rbus_size=0x80000",
    "pli_base=0x20000000",
    "pli_max=0x60000000",
    "pli_step=0x8000000",
    "pli_rbus=0x10000000",
    "pli_window=0x8000000",
    "pli_uncached=0x8000000",
    "pli_pad=0x10000",
    "dcu1_base=0x20000000",
    "dcu1_size=0x20000000",
    "dcu2_base=0x40000000",
    "dcu2_size=0x20000000",
    "clock90k=0xb801b6b8,0xb801b6bc",
    """nodes=rtkaudio,audio_hw,rtkvdec,rtkdemux,rtkdemod,rtkademod,vscdev,vfedev,vbedev,vpqdev,\
        vpqmemc,vpqleddev,vodev,vivtdev,sys-misc,sys-intmicom,se0,gdma_hal_gal0,hdcp2dev,otp,\
        mcp/core,mcp/cipher,mcp/dgst,mcp_core,mcp_cipher,mcp_dgst,rcp_core,venus_gpio,pwm0,\
        rtd-logger,cec0,dolbyvisionEDR0,rtk_spi,rtk_rng,rtkdelivery,irtx-0,video28,video30,video31""",
    "ucom_node=sys-intmicom",
    "waits=cec0:0xc0386106",
    "v4l2_vsc=video30,video31",
    "pwms=pwm-I-0,pwm-I-1,pwm-I-2,pwm-I-3,pwm-M-0,pwm-M-1,pwm-M-2,pwm-M-3",
    "gpio_lines=734",
    "vt=vivtdev:1920:1080:60",
    "rpc_word=100:12070:2:0x11000",
    "tee=1",
    "fb=1:512x2160",
    "vsc_screen=3840,2160",
    "gpio_level=71:1,87:1",
    "gpio_usb_vbus=69,86",
]
derived = "rpc-table"

[[modules]]
name = "webos_tv"
params = [
    "platform=wfm",
    "frontends=2",
    "delsys=3+16+1+2+5+6+18,3+16+1+2+5+6+18",
    "version=2.1.0",
    "version_cmd=0x68",
    "answers=0x80:6401",
    "atv=2",
]
