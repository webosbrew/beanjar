# The Realtek "K24N" (W25H's SoC; its U-Boot passes chip=K24N, "LGE K8 Board"): K24's platform.
# W25H's bsppart libkadaptor, libhal_sys and libhal_rtd2872 are other builds than W24H's with the
# same exports and /dev, /sys and /proc names, and the same RPC answer table (rpc-table); its I2C
# table, DILE_I2C's seven adapters, libdil_tu_plugin (2.1) and every fstab and jail pin are W24H's.
# Its libdile_gpio (33.31.68) keeps K24's lines, USB ones and HDMI detects included, and adds the
# LNB outputs GPIO_WR_LNB_14V_19V 29 and GPIO_WR_LNB_EN 2: K24's rtk row serves them all
# (soc/k24.toml).

base = "k24"
# Its only queue firmware is the Japanese ARIB build (W25H 43.22.66), whose model_id.json says
# ARIB: it boots the Japanese OLED55B5PJA (board-arib.cmdline), from that firmware's own generators.
broadcast_boards = { atsc = "/etc/emulator/board-atsc.cmdline", dvb = "/etc/emulator/board-dvb.cmdline", arib = "/etc/emulator/board-arib.cmdline" }
# The tuners are K24's (soc/k24.toml), modules included: W25H ponytail's (33.31.68) webos_tv.ko,
# atsc_dtv_soc.ko, libdil_tu_plugin (2.1), legacy-broadcast-atsc and webos-tv.sh are W24H
# ponytail's (33.31.68) byte for byte, si2178b.ko and the libdile_i2c tuner rows too, and the US
# board's hwopt gives the same tv.hw in both: tuner NTSC_SI2178B, demodulator ATSC_DTV_SOC, one
# frontend. W25H adds atv_soc.ko and atv_soc_chip.ko, the SoC's analog demod, which only a tuner
# level of 5 selects. The queue board is the Japanese ARIB one, which keeps K24's default
# values (two DVB frontends: no ISDB-T lock).
