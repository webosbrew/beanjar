# W22P initially uses K7LP's Realtek driver boundary. Its matching W22 GPL
# dvbfrontend_version.h declares 2.1.00, the same frontend ABI used here.
# This is a bring-up profile, not a measured K8LP hardware implementation.
# Its frontends are K7LP's European board's on every board (the W22P scan trace probed
# 3+16+1+2+5+6+18 on two frontends); its US board's own tuner values are not derived yet, so
# K7LP's US broadcast_params (W21P's) are not taken. It has the lock's commands and dtv_soc.
# The K8 chips based on this one keep the frontend boundary they had before the tuner
# work: webos_tv with K7LP's European values and no signal source; each board's own
# tuner values are not derived yet.

base = "k7lp"
# K7LP's lgemu, and earc=1: the eARC transmitter at /dev/earc0 (lgemu earc.c), which arccontroller
# (nyxEarc.module on the 43.x builds) enables with the user's eARC Support on and polls for the sound
# bar's connection and capability; every K8 profile (W22H, W22P, W23H, W23P, W24P, W24H) has
# arc.supportEarc.
lgemu = [
    "i2c_buses=0,1,2,3,4,5", "i2c_dev=nvm:4:0x50,amp:0:0x2a,amp:0:0x2b", "snd_ctls=1", "earc=1",
]
broadcast_params = {}

# gpio_usb_vbus and gpio_level: the USB ports' power switches and overcurrent inputs
# (soc/k6lp.toml says how they were read)
[[modules]]
name = "rtk"
params = [
    "rbus_phys=0x18000000",
    "rbus_size=0x80000",
    "pli_base=0x20000000",
    "pli_max=0x60000000",
    "pli_step=0x8000000",
    "pli_rbus=0x10000000",
    "pli_window=0x8000000",
    "pli_uncached=0x8000000",
    "pli_pad=0x10000",
    "dcu1_base=0x20000000",
    "dcu1_size=0x20000000",
    "dcu2_base=0x40000000",
    "dcu2_size=0x20000000",
    "clock90k=0xb801b6b8,0xb801b6bc",
    """nodes=rtkaudio,audio_hw,rtkvdec,rtkdemux,rtkdemod,rtkademod,vscdev,vfedev,vbedev,vpqdev,\
        vpqmemc,vpqleddev,vodev,vivtdev,sys-misc,sys-intmicom,se0,gdma_hal_gal0,hdcp2dev,otp,\
        mcp/core,mcp/cipher,mcp/dgst,mcp_core,mcp_cipher,mcp_dgst,rcp_core,venus_gpio,pwm0,\
        rtd-logger,cec0,dolbyvisionEDR0,rtk_spi,rtk_rng,rtkdelivery,irtx-0,video28,video30,video31""",
    "ucom_node=sys-intmicom",
    "waits=cec0:0xc0386106",
    "v4l2_vsc=video30,video31",
    "pwms=pwm-I-0,pwm-I-1,pwm-I-2,pwm-I-3,pwm-M-0,pwm-M-1,pwm-M-2,pwm-M-3",
    "gpio_lines=460",
    "vt=vivtdev:1920:1080:60",
    "rpc_word=100:12070:2:0x11000",
    "tee=1",
    "fb=1:512x2160",
    "vsc_screen=3840,2160",
    "gpio_level=33:1,152:1",
    "gpio_usb_vbus=36,151",
]
derived = "rpc-table"

[[modules]]
name = "webos_tv"
params = [
    "platform=wfm",
    "frontends=2",
    "delsys=3+16+1+2+5+6+18,3+16+1+2+5+6+18",
    "version=2.1.0",
    "version_cmd=0x68",
    "answers=0x80:6401",
    "freq_cmd=0x5d",
    "status_cmd=0x81",
    "monitor_cmd=0x71",
    "specstore_cmd=0x56",
    "speccheck_cmd=0x55",
    "strength_cmd=0x60",
    "quality_cmd=0x61",
    "atv=2",
]

[[modules]]
name = "dtv_soc"
