# W23H's global K8HPP firmware selects DVB. The existing Realtek boundary is
# provisional; its board and partition pins are measured separately.

base = "k8lp"
# Runtime DILE initialization opens buses 0..6; stock NVM remains 4/0xa0. earc=1 as K8LP's.
lgemu = [
    "i2c_buses=0,1,2,3,4,5,6", "i2c_dev=nvm:4:0x50,amp:0:0x2a,amp:0:0x2b", "snd_ctls=1", "earc=1",
]

# gpio_usb_vbus and gpio_level: the USB ports' power switches and overcurrent inputs
# (soc/k6lp.toml says how they were read)
[[modules]]
name = "rtk"
params = [
    "rbus_phys=0x18000000",
    "rbus_size=0x80000",
    "pli_base=0x20000000",
    "pli_max=0x60000000",
    "pli_step=0x8000000",
    "pli_rbus=0x10000000",
    "pli_window=0x8000000",
    "pli_uncached=0x8000000",
    "pli_pad=0x10000",
    "dcu1_base=0x20000000",
    "dcu1_size=0x20000000",
    "dcu2_base=0x40000000",
    "dcu2_size=0x20000000",
    "clock90k=0xb801b6b8,0xb801b6bc",
    """nodes=rtkaudio,audio_hw,rtkvdec,rtkdemux,rtkdemod,rtkademod,vscdev,vfedev,vbedev,vpqdev,\
        vpqmemc,vpqleddev,vodev,vivtdev,sys-misc,sys-intmicom,se0,gdma_hal_gal0,hdcp2dev,otp,\
        mcp/core,mcp/cipher,mcp/dgst,mcp_core,mcp_cipher,mcp_dgst,rcp_core,venus_gpio,pwm0,\
        rtd-logger,cec0,dolbyvisionEDR0,rtk_spi,rtk_rng,rtkdelivery,irtx-0,video28,video30,video31""",
    "ucom_node=sys-intmicom",
    "waits=cec0:0xc0386106",
    "v4l2_vsc=video30,video31",
    "pwms=pwm-I-0,pwm-I-1,pwm-I-2,pwm-I-3,pwm-M-0,pwm-M-1,pwm-M-2,pwm-M-3",
    "gpio_lines=460",
    "vt=vivtdev:1920:1080:60",
    "rpc_word=100:12070:2:0x11000",
    "tee=1",
    "fb=1:512x2160",
    "vsc_screen=3840,2160",
    "gpio_level=33:1,152:1",
    "gpio_usb_vbus=36,151",
]
derived = "rpc-table"

# The tuners: W23H ombre (23.25.55), ponytail (33.31.61) and queue (43.22.73) ship webos_tv.ko,
# atsc_dtv_soc.ko, si2178b.ko, libdil_tu_plugin and legacy-broadcast-atsc byte for byte as W23P's in
# the same release (soc/k8lpn.toml, which says what each value is), so K8LPN's tuner. The parts
# are chosen at run time, not by a file: the plugin's DIL_TU_Probe writes webos_tv's frontend_type
# from tv.hw, which hw-option-gen makes from the board's hwopt; for the US board's
# (500200000004002000: no dual or triple tuner, internal DTV demod, tuner level 0) both firmwares
# give tuner NTSC_SI2178B, demodulator ATSC_DTV_SOC, one frontend, and their libdile_i2c tuner rows
# are the same. The number1 builds (W23H
# 13.41.12, and W23P 13.41.13 on this boundary, targets/k8lpn-number1.toml) are their own builds of
# the same shape as W22P's (soc/k8lp.toml): legacy-broadcast-atsc checks the frontend version
# itself (compare_dvbfrontend_version, 2.1: token 0 is 2, token 1 is 1), names the lock's
# properties and opens /dev/video2 and /dev/video20; their stock webos_tv.ko reports 2.1.0.
[[modules]]
name = "webos_tv"
params = [
    "platform=wfm",
    "frontends=2",
    "delsys=3+16+1+2+5+6+18,3+16+1+2+5+6+18",
    "version=2.1.0",
    "version_cmd=0x68",
    "answers=0x80:6401",
    "freq_cmd=0x5d",
    "status_cmd=0x81",
    "monitor_cmd=0x71",
    "specstore_cmd=0x56",
    "speccheck_cmd=0x55",
    "strength_cmd=0x60",
    "quality_cmd=0x61",
    "atv=2",
]

# the frontends' signal, the demuxes and the video decoder, fed from the host's tuner (beanjar io
# tuner, host/core/beanjar/tuner.py)
[[modules]]
name = "dtv_soc"

[broadcast_params.atsc]
webos_tv = ["frontends=1", "delsys=11+19+2"]
