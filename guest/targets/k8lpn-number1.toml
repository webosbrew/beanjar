models = ["W23P"]
bring_up = ["W23P"]
v4l2_capture = true

# W23P retains W22P's global pak and state pins; fonts loses its suffix.
[release]
base = "number1"
partmap = "kisscurl"

# W23P number1 takes K8HPP's tuner (soc/k8hpp.toml): its legacy-broadcast-atsc checks frontend 2.1
# (token 0 is 2, token 1 is 1; its stock webos_tv.ko reports 2.1.0) and, with the US board's
# hwopt, picks NTSC_SI2178B and ATSC_DTV_SOC, one frontend, as W23H number1's.
[soc]
base = "k8hpp"
lgemu = [
    "i2c_buses=0,1,2,3,4,5", "i2c_dev=nvm:4:0x50,amp:0:0x2a,amp:0:0x2b", "snd_ctls=1",
]
