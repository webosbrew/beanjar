# O26 container import produces raw named paks. These slots are VM allocations honoring this
# artifact's fixed pins, not retail geometry. W26O 43.11.77's fstabs pin cert p14, license p28,
# platform-plugins p32, UHDCP p51, DB8 p57, cmn_data p59 and apps p60, and its jails' secure-store
# nodes p17, p18, p21 and p24: two entries fewer between cert and p17 than o22n2-ombre's map
# (marlin and xcas are left out, a VM choice: nothing in the rootfs names them), which also puts
# the jail nodes on sestore, wossestore, sedata and pmsfw as ombre's p19, p20, p23 and p26 are;
# two VM reservations more before UHDCP and one between DB8 and cmn_data. No platform-plugins
# payload is supplied. Keep its pinned slot unbacked.

header = { pak = "rootfs", path = "/usr/sbin/see-init" }
reserved = { size = 0x1B800000, used = 0, valid = 0, flags = 1 }
