# E60N's stock fstabs pin O20N's and O22's readonly bank and UHDCP at p49, with the state one
# partition later than theirs, at p55-p57 (W21K 03.70.25: mount-readwrite's fstab). Its see-init
# carries the same stale bootstrap table, so the map is O22's assembled one with one more VM slot
# before the state. All other sizes/offsets below are VM allocations, not a claim about a retail
# partition map.
header = { pak = "rootfs", path = "/usr/sbin/see-init" }
reserved = { size = 0x1B800000, used = 0, valid = 0, flags = 1 }
parts = [
    { name = "secureboot", size = 0x100000, filename = "secureboot.bin", flags = 3 },
    { name = "partinfo", size = 0x40000, filename = "PART.INFO", sw_ver = 0x75, flags = 3 },
    { name = "mapbak", size = 0x40000, filename = "PART.INFO", sw_ver = 0x75, used = 0, flags = 1 },
    { name = "boot", size = { pak = "lxboot" }, filename = "boot.bin", flags = 3 },
    { name = "boot", size = { pak = "lxboot" }, filename = "boot.bin", used = 0, flags = 1 },
    { name = "swue", size = 0x1400000, filename = "swue.squashfs", flags = 3 },
    { name = "swue", size = 0x1400000, filename = "swue.squashfs", used = 0, flags = 1 },
    { name = "emergency", size = 0x40000, flags = 1 },
    { name = "crc32info", size = 0x40000, filename = "CRC32.INFO", flags = 3 },
    { name = "macadr", size = 0x40000, valid = 0, flags = 5 },
    { name = "env_nvm", size = 0x40000, flags = 5 },
