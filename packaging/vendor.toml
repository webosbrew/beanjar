# The prebuilt third-party programs the host build links and publishes and the packages ship:
# beanjar-vendor's releases (its README), one table per program, the release tag
# (<program>-<version>) and the SHA-256 of each architecture's tarball, from the release's
# SHA256SUMS. meson/vendor.py downloads them into build/vendor, checks them and unpacks them.
#
# A new version: tag a release in beanjar-vendor, then put its tag and the two hashes here (check
# them against a download, sha256sum, not only against SHA256SUMS) and rebuild; the host build
# reconfigures by itself when this file changes.

repository = "mariotaku/beanjar-vendor"

# QEMU with Beanjar's display patches: build/qemu, beanjar-qemu
[qemu]
tag = "qemu-10.0.2+beanjar2"
amd64 = "4872a52404375bc7c3ff7af7d68c211bceda34b518f29c816a8aaf6c1d9ba78b"
arm64 = "d3bea77cee63bde013d88249ec5b70992e33263805c516f0499e61bb7207361f"

# The static qemu-arm with the compat bridge, which runs in the guest
# (docs/dev/architecture/qemu-user-bridge.md): arm64 for the arm64 guest kernel, build/qemu-user;
# amd64, with qemu-aarch64, for the experimental x86-64 one, build/qemu-user-amd64 (amd64 hosts)
[qemu-user]
tag = "qemu-user-10.0.2+beanjar3"
guest = ["arm64", "amd64"]
arm64 = "9f32da5e5bccb378dbec4f4c1c26c5e6a764c9c093e36287860c63a857816594"
amd64 = "be75b81892da27bde0d280527715e4c6dfef026ec9d59faa58d61435d0162d14"

# FFmpeg with the V4L2 Request API hwaccels, /usr/lib/beanjar/ffmpeg: the media helper's
# decoding and beanjar-vnc's video (beanjar)
[ffmpeg]
tag = "ffmpeg-7.1.5+beanjar2"
amd64 = "5e093492b313aeb01f6d34864ed1c8f8b8c6800cef27aa82222be360cd2787e9"
arm64 = "d088d6b4a2ce45d4516dfe89bde8aa3f7524cc0b045b6021d34c7d25e44ff045"

# neatvnc 1.0 and aml 1.0, /usr/lib/beanjar/neatvnc: beanjar-vnc
[neatvnc]
tag = "neatvnc-1.0.4+beanjar2"
amd64 = "89f04fc26f789c30fd0c38d71b5679674bab42a6e63a1130168365ffc434afb4"
arm64 = "318eb4694cb0fb36a06567a15cd149d9199e18263ca36e82ec78cf6ad7f5285c"

# The test guest's userland, Buildroot's: scripts/testguest-setup, docs/dev/architecture/test-guest.md
[testguest]
tag = "testguest-2026.02.3+beanjar2"
guest = "armel"
armel = "51238cf0bf67ab500b8143e014a4178362c2e835257eac9c115b412666a2616e"
