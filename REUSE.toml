version = 1
SPDX-PackageName = "beanjar"
SPDX-PackageDownloadLocation = "https://github.com/webosbrew/beanjar"

# Source files that can carry a comment (Python, C, shell, JavaScript, TOML, Meson, units, ...)
# carry their own SPDX header. The entries below cover what cannot, or what a header would only
# clutter: data, images, documentation, patches, and one-line configuration files.

[[annotations]]
path = [
  "**.json",
  "**.csv",
  "**.txt",
  "**.sum",
  "**.replay",
  "**.list",
  "**.cmdline",
  "**.fstab",
  "**.override",
  "**.conf",
  "**.env",
  "**.xml",
  "**.ini",
  "**.in",
  "**.config",
  "**.service",
  "**.control",
  "**.md",
  "**.svg",
  "**.png",
  "**.webp",
  "**.pak",
  "**.pa",
  "**.map",
  "**.diff",
  "**.iobench",
  "**.cfg",
  "**.bml",
  "**.scc",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Mariotaku <git@mariotaku.me> and the Beanjar contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Patches carry the licence of the project they patch.
[[annotations]]
path = [
  "guest/kernel/patches/**.patch",
  "subprojects/packagefiles/linux/**.patch",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Mariotaku <git@mariotaku.me> and the Beanjar contributors"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = [
  "guest/layers/gl/patches/mesa/**.patch",
  "guest/layers/gl/patches/wayland/**.patch",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Mariotaku <git@mariotaku.me> and the Beanjar contributors"
SPDX-License-Identifier = "MIT"

# Data and generated files whose exact bytes matter, or that a header would only clutter.
[[annotations]]
path = [
  "tests/regress/tv-expect/**.toml",
  "guest/targets/**.toml",
  "guest/layers/hbchannel/versions/**",
  "guest/layers/soc/*/base",
  "guest/layers/webos/*/base",
  "guest/kernel/configs/webos_virt_defconfig",
  "packaging/VERSION",
  "host/ui/beanjar_ui/viewer/_core_abi.py",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Mariotaku <git@mariotaku.me> and the Beanjar contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

# The landing page's viewer shot, the README's copy of it and the share card made from it show a
# frame of Big Buck Bunny playing on the TV.
[[annotations]]
path = [
  "site/images/viewer-window.png",
  "site/images/share-card.png",
  "docs/assets/screenshots/beanjar-viewer.png",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Mariotaku <git@mariotaku.me> and the Beanjar contributors",
  "Big Buck Bunny (c) copyright 2008, Blender Foundation, www.bigbuckbunny.org",
]
SPDX-License-Identifier = "GPL-2.0-or-later AND CC-BY-3.0"
